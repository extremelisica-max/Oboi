<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oboi — prototype</title>
    <script type="module" crossorigin src="./assets/index-D2WqyzPn.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DnalKE06.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Temporary in-page error overlay to surface runtime errors during development
      window.addEventListener('error', (e) => {
        try{
          const pre = document.createElement('pre')
          pre.style.cssText = 'position:fixed;left:0;top:0;right:0;z-index:99999;background:#fff;color:#111;padding:12px;font-family:monospace;white-space:pre-wrap;max-height:40vh;overflow:auto;border-bottom:1px solid rgba(0,0,0,.06)'
          pre.textContent = 'Error: ' + (e.message || '') + '\n' + (e.error && e.error.stack ? e.error.stack : (e.filename ? e.filename + ':' + e.lineno + ':' + e.colno : ''))
          document.body.appendChild(pre)
        }catch(_){/* ignore overlay failures */}
      })
      window.addEventListener('unhandledrejection', (e) => {
        try{
          const pre = document.createElement('pre')
          pre.style.cssText = 'position:fixed;left:0;bottom:0;right:0;z-index:99999;background:#fff;color:#111;padding:12px;font-family:monospace;white-space:pre-wrap;max-height:40vh;overflow:auto;border-top:1px solid rgba(0,0,0,.06)'
          pre.textContent = 'UnhandledRejection: ' + (e.reason && (e.reason.stack || e.reason.message) || String(e.reason))
          document.body.appendChild(pre)
        }catch(_){/* ignore overlay failures */}
      })
      console.log('dev overlay installed')
    </script>
  </body>
</html>
